name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Chromium para os testes
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: node ferramentas/test.js
      - name: Montar o site
        run: sh ferramentas/site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
