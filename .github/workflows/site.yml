name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Por padrão só leitura; quem publica (job publicar) recebe pages e id-token. Spec 017.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Instalar Chromium para os testes
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: node ferramentas/test.js
      - name: Montar o site
        run: sh ferramentas/site.sh
      - name: Verificar o site montado como um jogador
        run: |
          (python3 -m http.server 8080 -d _site >/dev/null 2>&1 &)
          sleep 1
          PAUSA_MS=1000 node ferramentas/verificar-site.mjs http://127.0.0.1:8080/ /tmp/verificacao.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
