name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Por padrão só leitura; quem publica (job publicar) recebe pages e id-token. Spec 017.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar Chromium para os testes
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: node ferramentas/test.js
      - name: Montar o site
        run: sh ferramentas/site.sh
      - name: Verificar o site montado como um jogador
        run: |
          (python3 -m http.server 8080 -d _site >/dev/null 2>&1 &)
          sleep 1
          PAUSA_MS=1000 node ferramentas/verificar-site.mjs http://127.0.0.1:8080/ /tmp/verificacao.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
