name: Coletar métricas

# Uma vez por dia lê os números do Umami (link de compartilhamento) e grava metricas.json
# na branch "metricas". O painel da Colmeia no projeto lê esse arquivo. Spec 009.
# Também confere se o site responde e lê a última verificação diária (verificar-site.yml). Spec 010.
on:
  schedule:
    - cron: "17 11 * * *"   # 08:17 em Brasília, depois da verificação diária do site (07:41)
  workflow_dispatch:

# Por padrão nada. Quem lê (job coletar) só lê; só o job gravar escreve, e só na branch metricas. Spec 017.
permissions: {}

concurrency:
  group: metricas
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # ler as execuções e o resumo da verificação do site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Ler a última verificação do site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list -w verificar-site.yml -s completed -L 14 --json databaseId,conclusion,createdAt,url,event > /tmp/verificacao-run.json || echo '[]' > /tmp/verificacao-run.json
          id=$(jq -r '.[0].databaseId // empty' /tmp/verificacao-run.json)
          if [ -n "$id" ]; then gh run download "$id" -n verificacao -D /tmp/verificacao || echo "Execução $id sem resumo"; fi
      - name: Ler o Umami
        # O link de compartilhamento do Umami abre o painel inteiro: fica só no secret UMAMI_SHARE, nunca no repositório.
        env:
          UMAMI_SHARE: ${{ secrets.UMAMI_SHARE }}
        run: |
          if [ -z "$UMAMI_SHARE" ]; then echo "::error::Falta o secret UMAMI_SHARE (Settings > Secrets and variables > Actions)"; exit 1; fi
          node ferramentas/metricas.mjs /tmp/metricas.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metricas
          path: /tmp/metricas.json
          retention-days: 1

  gravar:
    needs: coletar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: metricas
          path: /tmp/m
      - name: Gravar na branch metricas
        run: |
          cd "$(mktemp -d)"
          git init -q -b metricas
          cp /tmp/m/metricas.json .
          git add metricas.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Métricas $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" metricas
