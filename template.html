<title>Colmeia de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen game. Desktop = hive column + side panel; phone = stacked, hive near the thumb. */
:root{
  --bg:#EDF0E8; --panel:#F8F9F4; --ink:#22213A; --muted:#626574; --line:#D3D8CB;
  --cell:#FFFFFF; --cell-ink:#22213A; --honey:#F0A531; --honey-ink:#3B2400;
  --plum:#5B3A8C; --plum-soft:#E6DEF3; --good:#257A4E; --bad:#B53A33;
  --shadow:0 1px 0 rgba(34,33,58,.06),0 6px 18px rgba(34,33,58,.07);
  --honey-text:#8A5200; --logo-l:block; --logo-d:none;
  --space-4:4px; --space-6:6px; --space-8:8px; --space-10:10px; --space-12:12px; --space-14:14px; --space-16:16px; --space-22:22px;
  --radius-sm:7px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-2xl:20px; --radius-pill:999px;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16151E; --panel:#1F1E2A; --ink:#ECEAF4; --muted:#A3A0B4; --line:#34313F;
  --cell:#2A2838; --cell-ink:#ECEAF4; --honey:#F4B04A; --honey-ink:#2B1A00;
  --plum:#BBA0EE; --plum-soft:#2E2742; --honey-text:#F4B04A; --logo-l:none; --logo-d:block;  --good:#5CC48C; --bad:#F07A70;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16151E; --panel:#1F1E2A; --ink:#ECEAF4; --muted:#A3A0B4; --line:#34313F;
  --cell:#2A2838; --cell-ink:#ECEAF4; --honey:#F4B04A; --honey-ink:#2B1A00;
  --plum:#BBA0EE; --plum-soft:#2E2742; --honey-text:#F4B04A; --logo-l:none; --logo-d:block;  --good:#5CC48C; --bad:#F07A70;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;margin:0;line-height:0}
.brand img{height:28px;width:auto}
.brand .lg-l{display:var(--logo-l)}.brand .lg-d{display:var(--logo-d)}
.sheet .mark{height:36px;width:auto;margin-bottom:6px}
.sheet .mark.lg-l{display:var(--logo-l)}.sheet .mark.lg-d{display:var(--logo-d)}
.modes{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.modes button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dailies{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dailies button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:92px}
.dailies button b{font-family:var(--display);font-size:.92rem}
.dailies button small{font-size:.72rem;color:var(--muted)}
.dailies button[aria-pressed="true"]{border-color:var(--honey);box-shadow:inset 0 0 0 1px var(--honey)}
.iconbtn{border:1px solid var(--line);background:var(--panel);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:22px;align-items:start}
.play{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-14) var(--space-16)}
/* rank */
.rankrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rankname{font-family:var(--display);font-weight:800;font-size:1.3rem}
.rankname.pop{animation:pop .6s}
.pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.pts b{color:var(--ink);font-size:1.15rem}
.track{position:relative;height:26px;margin-top:10px}
.track::before{content:"";position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.fill{position:absolute;left:0;top:11px;height:4px;background:var(--honey);border-radius:2px;transition:width .5s}
.dot{position:absolute;top:8px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--honey)}
.dot.cur{width:24px;height:24px;top:1px;margin-left:-12px;background:var(--honey);color:var(--honey-ink);font-size:.7rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sub{font-size:.82rem;color:var(--muted);margin-top:4px}
/* combo / timer */
.hud{display:flex;gap:10px;width:100%;max-width:440px;align-items:center;min-height:34px}
.timer{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;background:var(--plum);transition:width .25s linear}
.timer.low span{background:var(--bad)}
.clock{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:1.25rem;min-width:3.2ch;text-align:right}
.combo{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--plum-soft);color:var(--plum);font-weight:700;font-size:.85rem;opacity:.45;transition:opacity .2s}
.combo.live{opacity:1}
.combo .ring{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--plum) calc(var(--p,0)*1turn),transparent 0);position:relative}
.combo .ring::after{content:attr(data-x);position:absolute;inset:3px;border-radius:50%;background:var(--plum-soft);display:grid;place-items:center;font-size:.72rem}
.combo.bump{animation:pop .35s}
/* input */
.toast{height:30px;display:flex;align-items:center;justify-content:center}
.toast span{padding:4px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.9rem;animation:toast 1.3s forwards}
.toast .sug{margin-left:8px;border:1px solid var(--line);background:var(--panel);color:var(--plum);font-weight:700;font-size:.8rem;border-radius:999px;padding:2px 10px;min-height:24px}
.toast small.sug{border:0;background:none;color:var(--muted)}
.toast span.big{background:var(--honey);color:var(--honey-ink);font-family:var(--display);font-size:1.05rem;letter-spacing:.04em}
.entry{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.04em;min-height:48px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;max-width:100%;overflow:hidden}
.entry .c{color:var(--honey-text)}
.entry .x{color:var(--muted)}
.entry .caret{width:2px;height:32px;background:var(--plum);margin-left:2px;animation:blink 1s steps(1) infinite}
.entry.shake{animation:shake .4s}
/* hive */
.hive{position:relative;width:min(320px,82vw);aspect-ratio:314/301;max-width:100%}
.hex{position:absolute;width:31.85%;aspect-ratio:1/1.1547;border:0;padding:0;background:var(--cell);color:var(--cell-ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,6vw,1.9rem);text-transform:uppercase;transition:transform .15s,background .15s;display:grid;place-items:center;filter:drop-shadow(0 0 0 transparent)}
.hex:active,.hex.hit{transform:scale(.9)}
.hex.center{background:var(--honey);color:var(--honey-ink)}
.hex:focus-visible{outline:none;background:var(--plum);color:var(--bg)}
.hex.center:focus-visible{background:var(--plum);color:var(--bg);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hex.spin{animation:spin .45s}
.hexwrap{position:absolute;inset:0;filter:drop-shadow(0 2px 0 var(--line))}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 18px;border-radius:999px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.round{width:46px;padding:10px 0;font-size:1.1rem}
.btn:disabled{opacity:.45;cursor:default}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--bg)}
a:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
/* found */
.foundhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.foundhead h2,.card h2{font-family:var(--display);font-size:1rem;margin:0;font-weight:700}
.words{list-style:none;padding:0;margin:10px 0 0;columns:2;column-gap:18px;max-height:260px;overflow:auto}
.words li{padding:3px 0;border-bottom:1px solid var(--line);break-inside:avoid;text-transform:capitalize;display:flex;justify-content:space-between;gap:6px}
.words li small{color:var(--muted);font-variant-numeric:tabular-nums}
.words li.pg{font-weight:700;color:var(--plum)}
.words li.miss{color:var(--muted);font-style:italic}
.words li.new{animation:flash 1.2s}
.words li.ex,.exn{color:var(--honey-text)}
.words li.ex>span::after,.exn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;vertical-align:middle}
.words li.ex>span::after{margin-left:5px}
.exn::before{margin-right:4px}
.empty{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.linkbtn{border:0;background:none;color:var(--plum);font-weight:700;padding:0;font-size:.85rem}
/* hints */
.hintgrid{overflow-x:auto;margin-top:8px}
.hintgrid table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.85rem}
.hintgrid th,.hintgrid td{padding:3px 7px;text-align:center;border-bottom:1px solid var(--line)}
.hintgrid th{color:var(--muted);font-weight:700}
.hintgrid td:first-child,.hintgrid th:first-child{text-align:left;text-transform:uppercase;font-weight:700;color:var(--ink)}
.clues{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.clues span{font-family:var(--display);font-weight:700;letter-spacing:.12em;background:var(--plum-soft);color:var(--plum);padding:3px 9px;border-radius:7px;text-transform:uppercase}
.clues span.done{text-decoration:line-through;opacity:.55}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;text-align:center}
.statrow b{display:block;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.statrow span{font-size:.75rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:.78rem;padding:3px 9px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--honey);color:var(--ink);background:color-mix(in srgb,var(--honey) 18%,transparent)}
/* overlay */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-2xl);box-shadow:var(--shadow);padding:var(--space-22);max-width:440px;width:100%;max-height:90vh;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0 0 8px;text-wrap:balance}
.sheet p,.sheet li{max-width:62ch}
.sheet ul{padding-left:18px}
.sheet .controls{justify-content:flex-start;margin-top:14px}
.big-num{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:.7;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes spin{0%{transform:scale(1) rotate(0)}50%{transform:scale(.6) rotate(60deg);opacity:.3}100%{transform:scale(1) rotate(0)}}
@keyframes flash{0%{background:color-mix(in srgb,var(--honey) 45%,transparent)}100%{background:transparent}}
@media (max-width:760px){
  .main{display:flex;flex-direction:column;gap:12px;align-items:stretch}
  .side{display:contents}
  /* celular: colmeia logo abaixo do placar; lista, dicas e histórico depois */
  .app{gap:10px;padding-block:10px 20px}
  .o1{order:1}.play{order:2}.o2{order:3}.o4{order:4}.o5{order:5}
  .play{gap:6px}
  .words{max-height:120px;columns:3}
  .hive{width:min(260px,66vw)}
  .card{padding:10px 14px}
  .o1 .track{margin-top:4px}
  .o1 .rankname{font-size:1.15rem}
  .dailies{flex-wrap:nowrap;gap:6px}
  .dailies button{flex:1;flex-direction:row;justify-content:center;gap:5px;padding:5px 6px;min-width:0}
  .dailies .rk{display:none}
  .hud{min-height:28px}
  .toast{height:24px}
  .entry{min-height:40px}
  .modes{margin-left:0;order:3;width:100%;justify-content:space-between}
  .modes button{flex:1}
  .entry{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  avisar("erro",nome,limpa(msg),quadro(x&&x.stack)||("@"+e.lineno+":"+e.colno));
}catch(_){}});
addEventListener("unhandledrejection",function(e){try{
  var r=e.reason, st=r&&r.stack;
  if(!st||String(st).indexOf(PAGE)<0||/-extension:\/\//.test(st))return;
  avisar("promessa",r.name||"Erro",limpa(r.message),quadro(st));
}catch(_){}});
})();
</script>
<script>
document.documentElement.lang="pt-BR";
/*__DATA__*/
(function(){
"use strict";
const $=id=>document.getElementById(id);
function falhaStore(op,e){const C=window.COLMEIA_ERRO;if(C)C.avisar("armazenamento",(e&&e.name)||"Erro",op,"")}   // só o nome: a mensagem pode citar o que estava salvo
const store={get(k,d){try{const v=localStorage.getItem("colmeia:"+k);return v?JSON.parse(v):d}catch(e){falhaStore("ler",e);return d}},
  set(k,v){try{localStorage.setItem("colmeia:"+k,JSON.stringify(v))}catch(e){falhaStore("salvar",e)}}};
const A=97, bit=c=>1<<(c.charCodeAt(0)-A);
const MASK=WORDS.map(w=>{let m=0;for(const c of w)m|=bit(c);return m});
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const disp=w=>DISP[w]||w;
const EXTRAS=new Set(EXTRA);   // palavras extras (spec 011): valem e pontuam, mas não são respostas do desafio
const RANKS=[["Ovo",0],["Larva",.03],["Pupa",.08],["Operária",.15],["Exploradora",.25],["Guardiã",.40],["Rainha",.60]];
const BADGES=[["pang","Primeiro pangrama"],["combo5","Combo x5"],["rainha","Virou Rainha"],["r100","100 pts no Relâmpago"],["streak3","3 dias seguidos"],["semdica","Guardiã sem dicas"],["completa","Colmeia completa"]];
const COMBO_WINDOW=12000;
const EPOCH=new Date(2026,9,1);

function dayNumber(d=new Date()){const a=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((a-EPOCH)/864e5)+1}
function buildPuzzle(code){
  const center=code[0], letters=code.split(""), M=letters.reduce((m,c)=>m|bit(c),0), cb=bit(center);
  const valid=[];WORDS.forEach((w,i)=>{if((MASK[i]&~M)===0&&(MASK[i]&cb))valid.push(w)});
  const pangrams=valid.filter(w=>new Set(w).size===7);
  const max=valid.reduce((s,w)=>s+points(w),0);
  return {code,center,outer:letters.slice(1),letters:new Set(letters),valid:new Set(valid),list:valid,pangrams:new Set(pangrams),max};
}
const LONG_BONUS=3, LONG_MIN=8;
function points(w){return (w.length===4?1:w.length)+(new Set(w).size===7?7:0)+(w.length>=LONG_MIN?LONG_BONUS:0)}

let S={}, P=null, timerId=null, sound=store.get("sound",true), audio=null;
const stats=Object.assign({streak:0,lastDay:0,best:0,pangs:0,badges:[]},store.get("stats",{}));
function saveStats(){store.set("stats",stats);renderStats()}
function award(id){if(stats.badges.includes(id))return;stats.badges.push(id);saveStats();
  const name=(BADGES.find(b=>b[0]===id)||[])[1];if(name)setTimeout(()=>toast("Conquista: "+name,true),900)}

/* ---------- métricas (spec 009): só no site, quando o script do Umami está na página ---------- */
const TRACK=!!document.querySelector("script[data-website-id]"), TQ=[];
function flushTrack(){try{if(!window.umami||typeof window.umami.track!=="function")return;while(TQ.length){const [n,d]=TQ.shift();window.umami.track(n,d)}}catch(e){}}
function track(n,d){if(!TRACK)return;if(TQ.length<30)TQ.push([n,d||{}]);flushTrack()}
const modeName=()=>({diario:"Diário",livre:"Livre",relampago:"Relâmpago"})[S.mode]||S.mode;

/* ---------- modes ---------- */
function start(mode,opts={}){
  clearInterval(timerId);timerId=null;
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  let code, saved=null;
  if(mode==="diario"){S.day=dayNumber();S.k=opts.k!=null?opts.k:(S.k||0);saved=store.get("d"+S.day+"-"+S.k,null);code=(saved&&saved.code)||dailyCode(S.day,S.k)}
  else if(mode==="livre"){const sv=store.get("livre",null);
    if(opts.code){saved=sv&&sv.code===opts.code?sv:null;code=opts.code}
    else{saved=opts.fresh?null:sv;code=saved?saved.code:pickLivre()}
    markSeen(code)}
  else{code=opts.code||pickRich()}
  P=buildPuzzle(code);
  S=Object.assign({mode,day:S.day,k:S.k,input:"",found:[],extra:[],bonus:0,combo:0,last:0,clues:[],hintsUsed:0,gaveUp:false,outer:shuffle(P.outer.slice())},saved||{});
  if(!Array.isArray(S.extra))S.extra=[];
  S.extra=S.extra.filter(w=>{if(!P.valid.has(w))return true;if(!S.found.includes(w))S.found.push(w);return false});   // extra que entrou na lista do desafio passa a contar nele
  S.mode=mode;if(window.COLMEIA_ERRO)COLMEIA_ERRO.modo=modeName();S.input="";S.combo=0;S.last=0;S.outer=shuffle(P.outer.slice());
  if(mode==="relampago"){S.time=75;S.total=75;S.over=false;$("timer").hidden=false;$("clock").hidden=false;
    timerId=setInterval(tick,250);S.t0=performance.now()}
  else{$("timer").hidden=true;$("clock").hidden=true}
  $("b-new").hidden=mode!=="livre";$("b-giveup").hidden=mode==="relampago";
  $("b-hint").textContent=mode==="relampago"?"Revelar início (−5 s)":"Revelar início de palavra";
  renderHive();renderAll();
  track("partida",{modo:modeName(),desafio:mode==="diario"?DNAMES[S.k]:"-",origem:opts.link?"link":"normal",retomada:S.found.length?"sim":"não"});
}
const DAILY=3, DNAMES=["Manhã","Tarde","Noite"];
function dailyCode(day,k){return DAYS[((day-1)*DAILY+k)%DAYS.length]}
/* Livre: só desafios que nunca são diários (LIVRE) e sem repetir conjunto de letras já jogado */
const setOf=c=>[...c].sort().join("");
function pickLivre(){const seen=new Set(store.get("vistos",[]));let pool=LIVRE.filter(c=>!seen.has(setOf(c)));
  if(!pool.length){store.set("vistos",[]);pool=LIVRE}return pool[Math.floor(Math.random()*pool.length)]}
function markSeen(code){const v=store.get("vistos",[]),s=setOf(code);if(!v.includes(s)){v.push(s);store.set("vistos",v.slice(-1000))}}
function renderDailies(){
  const box=$("dailies");box.hidden=S.mode!=="diario";if(box.hidden)return;
  box.innerHTML="";
  for(let k=0;k<DAILY;k++){
    let label;
    if(k===S.k)label=`<span class="rk">${rankName()} · </span>${S.found.length}/${P.list.length}`;
    else{const sv=store.get("d"+S.day+"-"+k,null);if(sv&&sv.found&&sv.found.length){const pz=buildPuzzle(sv.code||dailyCode(S.day,k));
      const b=sv.found.concat(Array.isArray(sv.extra)?sv.extra:[]).reduce((a,w)=>a+points(w),0);let r=0;RANKS.forEach((x,i)=>{if(b/pz.max>=x[1])r=i});label=`<span class="rk">${sv.found.length===pz.list.length?"Completa":RANKS[r][0]} · </span>${sv.found.length}/${pz.list.length}`}else label="Novo"}
    const b=document.createElement("button");b.setAttribute("aria-pressed",k===S.k);b.innerHTML=`<b>${DNAMES[k]}</b><small>${label}</small>`;
    b.onclick=()=>{if(k!==S.k)start("diario",{k})};box.appendChild(b);
  }
}
function pickRich(){for(let i=0;i<40;i++){const c=LIVRE[Math.floor(Math.random()*LIVRE.length)];const p=buildPuzzle(c);if(p.list.length>=35)return c}return LIVRE[0]}
function persist(){
  const keep={code:P.code,found:S.found,extra:S.extra,bonus:S.bonus,clues:S.clues,hintsUsed:S.hintsUsed,gaveUp:S.gaveUp};
  if(S.mode==="diario")store.set("d"+S.day+"-"+S.k,keep);else if(S.mode==="livre")store.set("livre",keep);
}
function tick(){
  if(S.over)return;
  if(document.hidden||!$("overlay").hidden){S.t0=performance.now();return}
  const now=performance.now(),dt=(now-S.t0)/1000;S.t0=now;S.time=Math.max(0,S.time-dt);
  renderTimer();renderCombo();
  if(S.time<=0)endLightning();
}
function endLightning(){
  S.over=true;clearInterval(timerId);
  const score=base()+S.bonus, rec=score>stats.best;
  if(rec){stats.best=score;saveStats()}
  if(score>=100)award("r100");
  track("relampago-fim",{pontos:score,palavras:S.found.length,recorde:rec?"sim":"não"});
  sfx("end");
  sheet(`<h2>${rec?"Novo recorde!":"Tempo esgotado"}</h2>
   <div class="big-num">${score}</div><p class="sub">${base()} pts de palavras + ${S.bonus} de combo · ${S.found.length} palavras${extraTxt()}</p>
   <p>Recorde: <b>${stats.best}</b> pts</p>
   <p class="sub">Palavras que ficaram de fora: ${P.list.filter(w=>!S.found.includes(w)).slice(0,12).map(disp).join(", ")}${P.list.length-S.found.length>12?"…":""}</p>
   <div class="controls"><button class="btn primary" data-act="again">Jogar de novo</button><button class="btn" data-act="daily">Ir para o diário</button></div>`);
}

/* ---------- input ---------- */
function addLetter(c){
  if(S.over||!$("overlay").hidden)return;
  if(!P.letters.has(c)){bump($("entry"),"shake");return}
  if(S.input.length>=19)return;
  if(!S.input)clearToast();
  S.input+=c;renderEntry();sfx("tap");
  const el=document.querySelector(`.hex[data-l="${c}"]`);if(el){el.classList.add("hit");setTimeout(()=>el.classList.remove("hit"),110)}
}
function del(){S.input=S.input.slice(0,-1);renderEntry()}
function submit(){
  if(S.over)return;
  const w=S.input;if(!w)return;
  if(S.gaveUp){toast("As respostas já foram reveladas neste desafio");S.input="";renderEntry();return}
  let err=null;
  if(w.length<4)err="Muito curta";
  else if(!w.includes(P.center))err="Falta a letra central";
  else if(S.found.includes(w)||S.extra.includes(w))err="Já encontrada";
  else if(!P.valid.has(w)&&!EXTRAS.has(w))err={p:"Plural não vale",v:"Só verbos no infinitivo",f:"Pronomes não valem"}[REJ[w]]||"Não está na lista";
  if(err){toast(err,false,w,w.length>=4&&w.includes(P.center)&&!S.found.includes(w)&&!S.extra.includes(w)?w:null);bump($("entry"),"shake");sfx("bad");S.input="";setTimeout(renderEntry,380);return}
  const before=rankIndex();
  const now=performance.now();
  S.combo=(S.last&&now-S.last<COMBO_WINDOW)?Math.min(S.combo+1,5):1;S.last=now;
  const pt=points(w), bonus=pt*(S.combo-1);S.bonus+=bonus;
  const ex=!P.valid.has(w);   // palavra extra: pontua e dá tempo, mas não conta para completar o desafio
  if(ex)S.extra.push(w);else S.found.push(w);
  S.input="";
  const pg=!ex&&P.pangrams.has(w);
  if(S.mode==="relampago"){S.time+=pg?12:Math.min(2*w.length,14);S.total=Math.max(S.total,S.time)}
  if(pg){toast("PANGRAMA! +"+pt,true,w);confetti();sfx("pang");stats.pangs++;award("pang");saveStats();track("pangrama",{modo:modeName()})}
  else{toast((ex?"Palavra extra!":w.length>=LONG_MIN?"Palavra longa!":w.length>=7?"Incrível!":w.length>=5?"Ótimo!":"Boa!")+" +"+pt+(bonus?` (+${bonus} combo)`:""),false,w);sfx("good")}
  if(S.combo>=5)award("combo5");
  if(S.mode==="diario"&&S.found.length===5)markStreak();
  renderAll(w);persist();
  const after=rankIndex();
  if(after>before&&S.mode!=="relampago"){const el=$("rankname");el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
    setTimeout(()=>toast("Novo nível: "+rankName(),true),700);
    track("nivel",{modo:modeName(),nivel:RANKS[after][0],palavras:S.found.length});
    if(RANKS[after][0]==="Rainha")award("rainha");
    if(after>=5&&S.hintsUsed===0&&!S.gaveUp)award("semdica")}
  if(!ex&&S.found.length===P.list.length){award("completa");track("completa",{modo:modeName(),palavras:S.found.length});setTimeout(()=>{confetti();sheet(`<h2>Colmeia completa!</h2><p>Você achou todas as ${P.list.length} palavras.</p><div class="controls"><button class="btn primary" data-act="close">Fechar</button></div>`)},900)}
}
function markStreak(){
  if(stats.lastDay===S.day)return;
  stats.streak=stats.lastDay===S.day-1?stats.streak+1:1;stats.lastDay=S.day;
  if(stats.streak>=3)award("streak3");saveStats();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- hints ---------- */
function revealHint(){
  if(S.over||S.gaveUp)return;
  const left=P.list.filter(w=>!S.found.includes(w)&&!S.clues.includes(w));
  if(!left.length){toast("Sem palavras para revelar");return}
  if(S.mode==="relampago"&&S.time<=6){toast("Tempo insuficiente para uma dica");return}
  if(S.mode!=="relampago"&&S.hintsUsed>=3){toast("Você já usou as 3 dicas deste desafio");return}
  const w=left.sort((a,b)=>a.length-b.length)[Math.floor(Math.random()*Math.min(left.length,Math.ceil(left.length/2)))];
  S.clues.push(w);S.hintsUsed++;
  if(S.mode==="relampago"){S.time-=5}
  sfx("tap");renderHints();persist();track("dica",{modo:modeName()});
}
function giveUp(){
  sheet(`<h2>Ver todas as respostas?</h2><p>As palavras que faltam aparecem na lista e este desafio deixa de contar pontos.</p>
  <div class="controls"><button class="btn primary" data-act="reveal">Mostrar respostas</button><button class="btn" data-act="close">Continuar jogando</button></div>`);
}

/* ---------- render ---------- */
function base(){return S.found.concat(S.extra).reduce((s,w)=>s+points(w),0)}
const extraTxt=()=>S.extra.length?` + ${S.extra.length} extra${S.extra.length>1?"s":""}`:"";
function rankIndex(){const f=P.max?base()/P.max:0;let i=0;RANKS.forEach((r,k)=>{if(f>=r[1])i=k});return i}
function rankName(){return S.found.length===P.list.length?"Colmeia completa":RANKS[rankIndex()][0]}
function renderAll(newWord){renderDailies();renderEntry();renderRank();renderWords(newWord);renderHints();renderCombo();renderStats();if(S.mode==="relampago")renderTimer()}
function renderHive(){
  const wrap=$("hexwrap");wrap.innerHTML="";
  const g=1.07,w=100,h=115.47,W=w+2*w*g,H=h+1.5*h*g,cx=w*g,cy=.75*h*g;
  const off=[[0,0],[-w/2*g,-.75*h*g],[w/2*g,-.75*h*g],[w*g,0],[w/2*g,.75*h*g],[-w/2*g,.75*h*g],[-w*g,0]];
  const pos=off.map(([dx,dy])=>[(cx+dx)/W*100,(cy+dy)/H*100]);
  $("hive").style.aspectRatio=W+"/"+H;
  const ls=[P.center,...S.outer];
  ls.forEach((l,i)=>{const b=document.createElement("button");b.className="hex"+(i===0?" center":"");b.dataset.l=l;b.textContent=l;
    b.setAttribute("aria-label","Letra "+l.toUpperCase()+(i===0?" (central)":""));
    b.style.left=pos[i][0]+"%";b.style.top=pos[i][1]+"%";
    b.addEventListener("click",()=>addLetter(b.dataset.l));wrap.appendChild(b)});
}
function doShuffle(){shuffle(S.outer);
  const hs=[...document.querySelectorAll(".hex:not(.center)")];
  hs.forEach(h=>bump(h,"spin"));
  setTimeout(()=>hs.forEach((h,i)=>{h.textContent=S.outer[i];h.dataset.l=S.outer[i];h.setAttribute("aria-label","Letra "+S.outer[i].toUpperCase())}),200)}
function renderEntry(){
  const e=$("entry");
  e.innerHTML=[...S.input].map(c=>`<span class="${c===P.center?"c":P.letters.has(c)?"":"x"}">${c}</span>`).join("")+'<span class="caret"></span>';
  $("entrysr").textContent=S.input?"Palavra: "+[...S.input.toUpperCase()].join(" "):"";
}
function renderRank(){
  const b=base(), ri=rankIndex();
  $("rankname").textContent=S.mode==="relampago"?"Relâmpago":rankName();
  $("pts").textContent=S.mode==="relampago"?b+S.bonus:b;
  $("bonus").textContent=S.mode!=="relampago"&&S.bonus?`· +${S.bonus} combo`:"";
  const t=$("track");t.innerHTML="";t.hidden=S.mode==="relampago";
  const f=Math.min(1,P.max?b/P.max/RANKS[6][1]:0);
  const fill=document.createElement("div");fill.className="fill";fill.style.width=(f*100)+"%";t.appendChild(fill);
  RANKS.forEach((r,i)=>{const d=document.createElement("div");d.className="dot"+(i<=ri?" on":"")+(i===ri?" cur":"");
    d.style.left=(r[1]/RANKS[6][1]*100)+"%";if(i===ri)d.textContent=b;d.title=r[0];t.appendChild(d)});
  const next=RANKS[ri+1];
  let sub;
  if(S.mode==="relampago")sub=`Recorde: ${stats.best} pts · cada palavra dá mais tempo, o combo multiplica os pontos`;
  else if(next)sub=`Faltam ${Math.ceil(next[1]*P.max)-b} pts para ${next[0]}`;
  else sub=`Pontuação máxima do desafio: ${P.max}`;
  if(S.mode==="diario")sub=`Dia ${S.day} · ${DNAMES[S.k]} · `+sub;
  $("ranksub").textContent=sub;
}
function renderWords(newWord){
  const ul=$("words");
  $("foundtitle").innerHTML=`${S.found.length} de ${P.list.length} palavras`+(P.pangrams.size?` · ${[...P.pangrams].filter(w=>S.found.includes(w)).length}/${P.pangrams.size} pangrama${P.pangrams.size>1?"s":""}`:"")+(S.extra.length?` · <span class="exn">+${S.extra.length} extra${S.extra.length>1?"s":""}</span>`:"");
  let list=S.found.slice();
  if(S.gaveUp)list=P.list.slice();
  list=list.concat(S.extra).sort((a,b)=>a.localeCompare(b));
  $("wordsempty").hidden=list.length>0;ul.hidden=!list.length;
  ul.innerHTML=list.map(w=>{const ex=S.extra.includes(w);
    return `<li class="${P.pangrams.has(w)?"pg ":""}${ex?"ex ":S.found.includes(w)?"":"miss "}${w===newWord?"new":""}"><span>${disp(w)}${ex?'<span class="sr tag">extra</span>':""}</span><small>${points(w)}</small></li>`}).join("");
}
function renderHints(){
  const used=S.hintsUsed||0;
  $("hintsub").textContent=S.mode==="relampago"?"Cada dica custa 5 segundos.":`${3-Math.min(3,used)} de 3 dicas restantes. O mapa mostra quantas palavras faltam por letra inicial e tamanho.`;
  $("clues").innerHTML=S.clues.map(w=>`<span class="${S.found.includes(w)?"done":""}" title="${w.length} letras">${w.slice(0,2)}${"·".repeat(w.length-2)}</span>`).join("");
  $("b-hint").disabled=S.gaveUp||(S.mode!=="relampago"&&used>=3);
  $("b-giveup").disabled=S.gaveUp;
  if(!$("grid").hidden)renderGrid();
}
function renderGrid(){
  const left=P.list.filter(w=>!S.found.includes(w));
  const lens=[...new Set(P.list.map(w=>w.length))].sort((a,b)=>a-b);
  const starts=[...new Set(P.list.map(w=>w[0]))].sort();
  let h="<table><tr><th></th>"+lens.map(l=>`<th>${l}</th>`).join("")+"<th>Σ</th></tr>";
  starts.forEach(s=>{const row=lens.map(l=>left.filter(w=>w[0]===s&&w.length===l).length);
    h+=`<tr><td>${s}</td>${row.map(n=>`<td>${n||"–"}</td>`).join("")}<td><b>${row.reduce((a,b)=>a+b,0)}</b></td></tr>`});
  $("grid").innerHTML=h+"</table>";
}
function renderCombo(){
  const el=$("combo"),now=performance.now();
  const live=S.last&&now-S.last<COMBO_WINDOW&&S.combo>=1;
  if(!live&&S.combo){S.combo=0}
  const p=live?1-(now-S.last)/COMBO_WINDOW:0;
  el.classList.toggle("live",!!live);
  $("ring").style.setProperty("--p",p.toFixed(3));
  const nextX=Math.min((live?S.combo:0)+1,5);
  $("ring").dataset.x="x"+nextX;
  $("combotxt").textContent=live?(nextX>1?`Próxima vale x${nextX}`:"Combo"):"Combo: acerte em sequência";
}
function renderTimer(){
  const pct=Math.min(100,S.time/Math.max(75,S.total)*100);
  $("timerfill").style.width=pct+"%";$("timer").classList.toggle("low",S.time<15);
  const s=Math.ceil(S.time);$("clock").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function renderStats(){
  $("s-streak").textContent=stats.lastDay>=dayNumber()-1?stats.streak:0;
  $("s-best").textContent=stats.best;$("s-pang").textContent=stats.pangs;
  $("badges").innerHTML=BADGES.map(b=>`<span class="badge ${stats.badges.includes(b[0])?"got":""}">${b[1]}</span>`).join("");
}
let toastT;
function toast(msg,big,word,sug){const t=$("toast");t.innerHTML="";clearTimeout(toast.t);
  toast.t=setTimeout(()=>{if(word){const w=document.createElement("b");w.className="sr";w.textContent=disp(word).toUpperCase()+": ";t.appendChild(w)}

const SITE="https://yago-ananias.github.io/colmeia/", REPO="https://github.com/yago-ananias/colmeia";
function siteUrl(){try{if(/^https?:$/.test(location.protocol)&&/\.github\.io$/.test(location.hostname))return location.origin+location.pathname}catch(e){}return SITE}
function shareText(){
  const pg=[...P.pangrams].filter(w=>S.found.includes(w)).length, stars=pg?" "+"⭐".repeat(pg):"", full=S.found.length===P.list.length;
  if(S.mode==="relampago"){const p=base()+S.bonus;
    return `Colmeia Relâmpago ⚡ ${p} pts\n${S.found.length} palavra${S.found.length===1?"":"s"}${extraTxt()}${stars}\nConsegue mais? ${siteUrl()}?c=${P.code}&m=relampago&p=${p}`}
  let g="";const ri=rankIndex();for(let i=1;i<=7;i++)g+=i<=ri?"🟨":i===7&&full?"🍯":"⬜";
  const date=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  const extra=(S.hintsUsed?` · ${S.hintsUsed} dica${S.hintsUsed>1?"s":""}`:"")+(S.gaveUp?" · respostas vistas":"");
  return `${S.mode==="diario"?`Colmeia ${date} · ${DNAMES[S.k]}`:"Colmeia Livre"}\n${rankName()} ${g}${stars}\n${S.found.length}/${P.list.length} palavras${extraTxt()} · ${base()} pts${extra}\nJogue este desafio: ${siteUrl()}?c=${P.code}`;
}
async function share(){
  const txt=shareText();
  if(navigator.share&&matchMedia("(pointer: coarse)").matches){try{await navigator.share({text:txt});track("compartilhar",{modo:modeName(),via:"menu"});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(txt);toast("Resultado copiado");track("compartilhar",{modo:modeName(),via:"copia"})}
  catch(e){track("compartilhar",{modo:modeName(),via:"janela"});sheet(`<h2>Copie seu resultado</h2><pre style="white-space:pre-wrap">${txt.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre><div class="controls"><button class="btn" data-act="close">Fechar</button></div>`)}
}
/* sugestão de palavra: abre uma issue pronta no repositório do jogo */
function suggest(w,reason){
  const body=`Palavra: ${w}\nO jogo respondeu: ${reason}\nDesafio: ${P.code.toUpperCase()} (letra central ${P.center.toUpperCase()})\n\nSe a palavra tem acento, escreva aqui como ela é escrita:\n`;
  const url=`${REPO}/issues/new?title=${encodeURIComponent("Sugestão de palavra: "+w)}&body=${encodeURIComponent(body)}`;
  sheet(`<h2>Sugerir ${w.toUpperCase()}?</h2><p>Acha que essa palavra devia valer? A sugestão abre no GitHub, onde ficam as sugestões para a lista do jogo. Para enviar, é preciso ter uma conta lá.</p>
  <div class="controls"><a class="btn primary" data-act="suggest" data-w="${w}" data-r="${reason}" href="${url}" target="_blank" rel="noopener">Abrir sugestão</a><button class="btn" data-act="close">Cancelar</button></div>`);
}
/* link compartilhado: ?c=letras (central primeiro), &m=relampago e &p=pontos para desafiar no Relâmpago */
function fromLink(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return false}
  const c=(q.get("c")||"").toLowerCase();
  if(!/^[a-z]{7}$/.test(c)||new Set(c).size!==7)return false;
  const pz=buildPuzzle(c);if(!pz.pangrams.size||pz.list.length<10)return false;
  try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
  if(q.get("m")==="relampago"){const p=Math.max(0,Math.min(9999,parseInt(q.get("p"),10)||0));start("relampago",{code:c,link:true});
    sheet(`<h2>Desafio Relâmpago</h2><p>${p?`Alguém fez <b>${p} pontos</b> com estas letras. Consegue mais?`:"Um desafio Relâmpago com estas letras."} O relógio começa quando você fechar esta janela.</p><div class="controls"><button class="btn primary" data-act="close">Começar</button></div>`);return true}
  const d=dayNumber();for(let k=0;k<DAILY;k++)if(dailyCode(d,k)===c){start("diario",{k,link:true});return true}
  start("livre",{code:c,link:true});toast("Desafio compartilhado",true);return true;
}

/* ---------- sound + fx ---------- */
function sfx(kind){
  if(!sound)return;
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  const notes={tap:[[660,.04]],good:[[523,.08],[784,.12]],bad:[[220,.15]],pang:[[523,.1],[659,.1],[784,.1],[1047,.25]],end:[[392,.15],[330,.25]]}[kind]||[];
  let t=audio.currentTime;
  notes.forEach(([f,d])=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==="bad"?"sawtooth":"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(kind==="tap"?.04:.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}   // som é enfeite: navegador antigo sem connect() encadeado não pode travar a jogada
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue("--honey"),cs.getPropertyValue("--plum"),cs.getPropertyValue("--good")];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*3)],a:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
    x.beginPath();for(let k=0;k<6;k++){const an=Math.PI/3*k;x.lineTo(Math.cos(an)*p.r,Math.sin(an)*p.r)}x.fill();x.restore()});
    if(++n<120)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

$("overlay").addEventListener("click",e=>{
  const act=e.target.dataset&&e.target.dataset.act;
  if(e.target===$("overlay")&&!(S.mode==="relampago"&&S.over)){closeSheet();return}
  if(!act)return;
  closeSheet();
  if(act==="again")start("relampago");
  else if(act==="daily")start("diario");
  else if(act==="leave")start(e.target.dataset.mode,{fresh:false});
  else if(act==="reveal"){S.gaveUp=true;persist();renderAll();track("desistiu",{modo:modeName(),palavras:S.found.length})}
  else if(act==="suggest"){track("sugestao",{motivo:e.target.dataset.r||"-"});const v=store.get("sugeridas",[]),w=e.target.dataset.w;if(!v.includes(w)){v.push(w);store.set("sugeridas",v.slice(-200))}toast("Obrigado pela sugestão!")}
});
function focoTeclado(el){try{return el.matches(":focus-visible")}catch(e){return true}}   // navegador sem :focus-visible: deixa o navegador acionar o botão
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(!$("overlay").hidden){if(e.key==="Escape"&&!(S.mode==="relampago"&&S.over))closeSheet();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest("button,a,input,select,textarea")&&focoTeclado(e.target))return;   // botão com foco de teclado: o navegador aciona
  if(e.key==="Enter"){e.preventDefault();submit()}
  else if(e.key==="Backspace"){e.preventDefault();del()}
  else if(e.key===" "){e.preventDefault();doShuffle()}
  else if((e.key||"").length===1){const c=norm(e.key);if(/^[a-z]$/.test(c))addLetter(c)}
});
setInterval(()=>{if(S.mode!=="relampago")renderCombo()},200);
function checkNewDay(){if(S.mode==="diario"&&dayNumber()!==S.day){start("diario",{k:0});toast("Chegaram os desafios de hoje",true)}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(S.mode==="relampago")S.t0=performance.now();checkNewDay()});
setInterval(checkNewDay,30000);
renderSound();
if(!fromLink())start("diario");
function trackLoad(){const nav=performance.getEntriesByType&&performance.getEntriesByType("navigation")[0];
  const ms=nav&&nav.loadEventEnd>0?nav.loadEventEnd:performance.now();
  const dark=(document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";

if(TRACK){addEventListener("load",()=>setTimeout(()=>{flushTrack();trackLoad()},0));let tries=0;const iv=setInterval(()=>{flushTrack();if(++tries>20||!TQ.length&&window.umami)clearInterval(iv)},500)}
